name: Desktop installers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev xdg-utils gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo check --locked --target ${{ matrix.target }}
          cargo clippy --locked --target ${{ matrix.target }} -- -D warnings
          cargo test --locked
          node scripts/test-audio.mjs
          node scripts/test-playback.mjs
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version '^2'
      - uses: tauri-apps/tauri-action@v1
        with:
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }} --verbose
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: '[name]-[version]-[platform]-[arch]-[bundle]'
