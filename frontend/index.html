<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis</title><link rel="stylesheet" href="style.css"></head>
<body class="idle">
<main id="orb" data-tauri-drag-region aria-label="Jarvis"><div class="core" data-tauri-drag-region></div></main>
<button id="gear" aria-label="Ajustes" title="Ajustes" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1-2 4 2 2v3l4 3 3-1 3 1 4-3v-3l2-2-2-4-3-1-1-3Z"/><circle cx="12" cy="11" r="3"/></svg></button>
<section id="settings" aria-label="Ajustes de Jarvis" hidden>
<form id="form" autocomplete="off">
<label for="deepgram">Deepgram API key <span id="dg-dot" class="dot" role="status"></span></label>
<div class="secret"><input id="deepgram" type="password" autocomplete="new-password" spellcheck="false"><button type="button" class="eye" data-input="deepgram" aria-label="Mostrar clave de Deepgram">◉</button></div>
<button type="button" class="change" data-input="deepgram" hidden>Cambiar</button><small id="deepgram-message"></small>
<label for="xai">xAI API key <span id="xai-dot" class="dot" role="status"></span></label>
<div class="secret"><input id="xai" type="password" autocomplete="new-password" spellcheck="false"><button type="button" class="eye" data-input="xai" aria-label="Mostrar clave de xAI">◉</button></div>
<button type="button" class="change" data-input="xai" hidden>Cambiar</button><small id="xai-message"></small>
<label for="prompt">System prompt</label>
<textarea id="prompt" rows="8" spellcheck="true"></textarea>
<a href="#" id="restore">Restaurar predeterminado</a>
<details><summary>Avanzado</summary>
<label for="llm-model">Modelo de conversación</label><input id="llm-model">
<label for="available-models">Modelos disponibles en tu cuenta</label><select id="available-models"><option value="">Validando cuenta…</option></select>
<label for="tts-model">Modelo de voz</label><input id="tts-model">
<label for="speed">Velocidad</label><input id="speed" type="number" min="0.7" max="1.5" step="0.05">
<label for="language">Idioma de escucha</label><select id="language"><option value="es">Español</option><option value="multi">Multilingüe</option></select>
<label class="check"><input id="wake-enabled" type="checkbox">Responder al oír mi nombre</label>
<label for="wake-word">Nombre de activación</label><input id="wake-word">
<label for="agent">Agente de programación</label><select id="agent"><option value="claude">Claude Code</option><option value="codex">Codex</option></select>
<label for="projects">Carpeta de proyectos</label><input id="projects">
</details>
<p id="status" role="status" aria-live="polite"></p>
<details id="diagnostics"><summary>Diagnóstico</summary>
<div class="tests"><button id="test-voice" type="button">Test voice</button><button id="test-mic" type="button">Test microphone</button></div>
<p id="test-status" role="status" aria-live="polite"></p>
<label for="input-device">Micrófono</label><select id="input-device"><option value="">Predeterminado del sistema</option></select>
<label for="input-level">Nivel de entrada</label><meter id="input-level" min="0" max="1" value="0"></meter>
<label for="output-device">Salida de audio</label><select id="output-device"><option value="">Predeterminado del sistema</option></select>
<p id="mic-hint" hidden>Permite el micrófono en Configuración de Windows → Privacidad → Micrófono. <button id="mic-settings" type="button">Abrir permisos</button></p>
<dl id="health"></dl><label>Últimos 10 turnos (ms)</label><pre id="latency"></pre></details>
<button id="save" type="submit">Guardar</button>
</form>
</section>
<script type="module" src="main.js"></script></body></html>
